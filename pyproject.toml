[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-voice-analytics"
version = "0.1.0"
description = "Reusable sentiment + category + emotion + theme + attrition-risk toolkit for HR feedback data (exit interviews, staff surveys, pulse)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later AND LicenseRef-Commercial-Dual" }
authors = [{ name = "The Employee Voice Analytics authors" }]
keywords = ["hr", "analytics", "nlp", "sentiment", "feedback", "databricks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Human Resources",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Minimal hard deps so a fresh install gets the fallback engines only.
# Heavier ML deps are opt-in via `pip install employee-voice-analytics[ml]`.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# HuggingFace transformers backend (sentiment RoBERTa, BART-MNLI, GoEmotions).
ml = [
    "transformers>=4.40",
    "torch>=2.1",
    "sentencepiece",
]
# BERTopic + sentence-transformers backend (theme discovery).
topics = [
    "bertopic>=0.16",
    "sentence-transformers>=2.6",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
]
# Optional Azure OpenAI exec summary.
llm = ["openai>=1.30"]
# Everything that makes the package production-shaped.
all = [
    "employee-voice-analytics[ml,topics,llm]",
]
# Databricks / PySpark runtime for the notebook.
databricks = ["pyspark>=3.5", "delta-spark>=3.0"]
# Local dev / test toolchain.
dev = [
    "pytest>=7.4",
    "pyspark>=3.5",
    "delta-spark>=3.0",
    "openai>=1.30",
]

[project.urls]
Homepage = "https://github.com/rollroyces/employee-voice-analytics"
Repository = "https://github.com/rollroyces/employee-voice-analytics"
Issues = "https://github.com/rollroyces/employee-voice-analytics/issues"

[project.scripts]
# After `pip install employee-voice-analytics`, the CLI is on PATH as
# `employee-voice` (hyphen, like the repo name). The original `run_pipeline.py`
# is kept as a thin shim for backwards compatibility.
employee-voice = "employee_voice.cli:main"

[tool.setuptools]
# Pull in everything under employee_voice/ automatically — no manual list.
include-package-data = true

[tool.setuptools.package-data]
employee_voice = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["employee_voice*"]

[tool.pytest.ini_options]
minversion = "7.0"
# Default to skipping the Databricks notebook test (it needs Java +
# PySpark + delta-spark). Run it explicitly with `pytest -m databricks`.
addopts = "-ra -q -m 'not databricks'"
testpaths = ["tests"]
markers = [
    "databricks: tests that require Java + PySpark (run explicitly with `pytest -m databricks`)",
]

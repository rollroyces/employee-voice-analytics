name: benchmarks

# Run the lexicon + HF benchmarks on every push to main and on
# pull requests. Posts the medaillon-speedup and HF per-layer
# throughput as a comment on the PR so reviewers can spot
# regressions at a glance.
#
# Why not in the regular test job? The HF bench downloads ~500 MB
# of model weights on first use and takes 2-3 minutes. Keeping
# it in a separate workflow means PRs that only change docs or
# non-perf code don't pay the cost.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lexicon bench — runs on every PR. ~30s.
  bench-lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run lexicon bench (1k rows)
        run: |
          python benchmarks/bench.py --rows 1000 --backend lexicon \
            --out /tmp/lexicon_1k.md --csv /tmp/lexicon_1k.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-lexicon-1k
          path: /tmp/lexicon_1k.{md,csv}

  # Slower HF bench — runs on push to main and on PRs labelled
  # `bench-hf`. ~3 min. Skipped by default to keep PR CI fast.
  bench-hf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on push to main, or when the PR has the bench-hf label.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bench-hf'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (incl. ML deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ml]'
      - name: Run HF bench (100 rows)
        run: |
          python benchmarks/bench_hf.py --rows 100 --warmup-rows 20
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-hf-100
          path: benchmarks/results_hf.{md,csv}
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const csv = fs.readFileSync('benchmarks/results_hf.csv', 'utf8').trim();
            const lines = csv.split('\n');
            const header = lines[0].split(',');
            const rows = lines.slice(1).map(l => l.split(','));
            let body = '### :rocket: HF benchmark\n\n';
            body += '| ' + header.join(' | ') + ' |\n';
            body += '|' + header.map(() => '---').join('|') + '|\n';
            for (const r of rows) {
              const layer = r[0];
              const rps = parseFloat(r[3]).toFixed(1);
              body += `| \`${layer}\` | ${r[1]} | ${parseFloat(r[2]).toFixed(2)} | ${rps} |\n`;
            }
            body += '\n_Generated by [benchmarks/bench_hf.py](' +
                    './blob/main/benchmarks/bench_hf.py). Add the `bench-hf` ' +
                    'label to a PR to re-run._';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

  # Optional: category model comparison. Downloads multiple
  # zero-shot NLI models (~1 GB total). Opt-in via `bench-cat`
  # label. ~3 min.
  bench-category-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bench-cat'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (incl. ML deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ml]'
      - name: Run category model comparison
        run: |
          python benchmarks/bench_category_models.py --rows 50 \
            --models facebook/bart-large-mnli,MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli,cross-encoder/nli-deberta-v3-small,typeform/distilbert-base-uncased-mnli
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-category-models
          path: benchmarks/results_category_models.{md,csv}

  # Optional: comment on PR with the lexicon speedup.
  comment-lexicon:
    runs-on: ubuntu-latest
    needs: bench-lexicon
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Compute speedup
        run: |
          python -c "
          import pandas as pd
          df = pd.read_csv('/tmp/lexicon_1k.csv').set_index('label')
          full = df.loc['analyze_feedback', 'seconds']
          gold = df.loc['score_gold_from_silver', 'seconds']
          print(f'FULL={full}')
          print(f'GOLD={gold}')
          print(f'SPEEDUP={full/gold:.1f}')
          " | tee /tmp/speedup.env
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = Object.fromEntries(
              fs.readFileSync('/tmp/speedup.env', 'utf8').trim().split('\n')
                .map(l => l.split('=', 2))
            );
            const full = parseFloat(env.FULL).toFixed(2);
            const gold = parseFloat(env.GOLD).toFixed(2);
            const speedup = parseFloat(env.SPEEDUP).toFixed(1);
            const body = `### :bar_chart: Lexicon benchmark (1k rows)\n\n`
              + `| stage | seconds |\n|---|---:|\n`
              + `| \`analyze_feedback\` (full) | ${full}s |\n`
              + `| \`score_gold_from_silver\` (Gold only) | ${gold}s |\n`
              + `| **medaillon speedup** | **${speedup}×** |\n\n`
              + `If the speedup drops below 10× on a 1k-row run, that is a regression.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
